services:
  yingyue-sync:
    image: heibai082/yingyue-sync:1.3
    container_name: yingyue-sync
    restart: unless-stopped
    ports:
      - "8090:8090"
    environment:
      - SYNC_TOKENS=me:change-me,friend:change-me-too
      - BACKUP_KEEP=14
      - TZ=Asia/Shanghai
    volumes:
      - ./data:/data